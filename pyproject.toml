[project]
name = "cartographer"
version = "0.1.0"
description = "Graph-grounded autonomous code agent: dependency-graph context retrieval for issue resolution"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Kanish Khetarpal" }]
dependencies = [
    "networkx>=3.3",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    # Base, not `embedding`: the embedding retriever's ranking math (cosine
    # similarity, argsort) is real numpy code that deserves real CI coverage
    # via a faked model, and numpy alone is ~15MB with no CUDA/torch weight
    # behind it -- nothing like the multi-hundred-MB `embedding` extra below,
    # which stays optional for exactly that reason.
    "numpy>=1.26",
]

[project.optional-dependencies]
# Kept separate so the graph engine (Phase 1) installs without pulling the
# agent/eval stack. `uv sync --all-extras` for the full thing.
agent = [
    "langgraph>=0.2",
    "anthropic>=0.34",
    "openai>=1.40",
]
eval = [
    "datasets>=2.20",
    "docker>=7.1",
    "swebench>=3.0",
]
embedding = [
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
]

[project.scripts]
cartographer = "cartographer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cartographer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer declares options as call-valued defaults; B008 is unavoidable there.
"cartographer/cli.py" = ["B008"]
